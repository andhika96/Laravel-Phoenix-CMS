<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Frontend Menu Dropdown Modal Mockup</title>
	<link href="/assets/plugins/bootstrap/5.3.6_custom/bootstrap.min.css" rel="stylesheet">
	<link href="/assets/plugins/fontawesome/5.15.3/css/all.min.css" rel="stylesheet">
	<style>
		:root {
			--cms-page: #eef8f3;
			--cms-panel: rgba(255, 255, 255, .88);
			--cms-border: #d7e0dc;
			--cms-border-soft: #edf3f0;
			--cms-text: #202733;
			--cms-muted: #66746f;
			--cms-green: #115b42;
			--cms-green-2: #18895f;
			--cms-green-soft: #e9f6f0;
			--cms-red: #ff2a35;
			--cms-red-soft: #fff1f2;
			--cms-shadow: 0 18px 52px rgba(35, 56, 48, .11);
			--cms-shadow-sm: 0 6px 18px rgba(35, 56, 48, .08);
			--font-main: "Inter", "Segoe UI", Arial, Helvetica, sans-serif;
		}

		* {
			box-sizing: border-box;
		}

		body {
			min-height: 100vh;
			margin: 0;
			color: var(--cms-text);
			background:
				radial-gradient(circle at 15% 18%, rgba(31, 160, 112, .08) 0 1px, transparent 2px),
				radial-gradient(circle at 74% 10%, rgba(31, 160, 112, .08) 0 2px, transparent 3px),
				linear-gradient(180deg, #ecfaf5 0%, #f8fbfa 45%, #edf5f2 100%);
			font-family: var(--font-main);
			font-size: 15px;
			line-height: 1.5;
		}

		a {
			color: var(--cms-green);
		}

		.mock-leftbar {
			position: fixed;
			z-index: 20;
			top: 0;
			bottom: 0;
			left: 0;
			width: 94px;
			background: rgba(237, 250, 246, .88);
			border-right: 1px solid rgba(17, 91, 66, .08);
			backdrop-filter: blur(16px);
			display: flex;
			flex-direction: column;
			align-items: center;
			padding: 24px 18px;
			gap: 28px;
		}

		.mock-logo {
			width: 42px;
			height: 42px;
			border-radius: 50%;
			display: grid;
			place-items: center;
			color: #fff;
			background: conic-gradient(from 210deg, #ff3039, #ff8c1a, #15b6b0, #1a7dff, #ff3039);
			box-shadow: 0 8px 18px rgba(17, 91, 66, .18);
			font-size: 19px;
		}

		.mock-rail-link {
			width: 42px;
			height: 42px;
			border: 0;
			background: transparent;
			color: #4c5b55;
			border-radius: 8px;
			display: grid;
			place-items: center;
			font-size: 18px;
		}

		.mock-rail-link.is-active {
			color: var(--cms-green);
			background: #ffffff;
			box-shadow: var(--cms-shadow-sm);
		}

		.mock-topbar {
			position: sticky;
			z-index: 15;
			top: 0;
			margin-left: 94px;
			min-height: 86px;
			background: rgba(239, 250, 246, .86);
			border-bottom: 1px solid rgba(17, 91, 66, .08);
			backdrop-filter: blur(15px);
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 0 32px;
		}

		.mock-topbar-left,
		.mock-topbar-right {
			display: flex;
			align-items: center;
			gap: 28px;
		}

		.mock-icon-button {
			width: 40px;
			height: 40px;
			border: 0;
			border-radius: 8px;
			background: transparent;
			color: #606963;
			display: grid;
			place-items: center;
			font-size: 18px;
		}

		.mock-icon-button:hover,
		.mock-icon-button:focus {
			color: var(--cms-green);
			background: #ffffff;
			outline: none;
		}

		.mock-content {
			margin-left: 94px;
			padding: 32px;
		}

		.ph-content {
			background: var(--cms-panel);
			border: 1px solid var(--cms-border);
			box-shadow: var(--cms-shadow);
			backdrop-filter: blur(12px);
		}

		.ph-content.rounded {
			border-radius: 8px !important;
		}

		.mock-breadcrumb {
			display: flex;
			align-items: center;
			flex-wrap: wrap;
			gap: 10px;
			margin: 6px 0 22px;
			color: #59635f;
			font-size: 18px;
		}

		.mock-breadcrumb strong {
			color: var(--cms-green);
			font-weight: 500;
		}

		.page-title {
			color: var(--cms-green);
			font-size: 34px;
			font-weight: 700;
			letter-spacing: 0;
			margin: 0;
		}

		.panel-heading {
			display: flex;
			align-items: center;
			gap: 12px;
			color: var(--cms-green);
			font-size: 28px;
			font-weight: 700;
			letter-spacing: 0;
			padding-bottom: 20px;
			margin-bottom: 22px;
			border-bottom: 1px solid var(--cms-border);
		}

		.parent-row {
			border-bottom: 1px solid var(--cms-border-soft);
			padding: 18px 0;
		}

		.parent-row:last-child {
			border-bottom: 0;
		}

		.parent-name {
			display: flex;
			align-items: center;
			gap: 10px;
			min-width: 0;
			font-size: 18px;
			color: #2e3338;
		}

		.parent-name i {
			color: #2d3338;
			width: 18px;
			text-align: center;
		}

		.drag-handle {
			color: #2d3338;
			margin-right: 4px;
		}

		.parent-actions {
			display: flex;
			align-items: center;
			justify-content: flex-end;
			flex-wrap: wrap;
			gap: 8px;
			font-size: 17px;
		}

		.parent-actions .divider {
			color: #30343a;
		}

		.link-action {
			border: 0;
			background: transparent;
			color: var(--cms-red);
			text-decoration: underline;
			padding: 0;
			font: inherit;
		}

		.link-action.dropdown-action {
			color: var(--cms-green);
			text-decoration-color: rgba(17, 91, 66, .42);
		}

		.link-action:hover,
		.link-action:focus {
			color: #b81922;
			outline: none;
		}

		.link-action.dropdown-action:hover,
		.link-action.dropdown-action:focus {
			color: var(--cms-green-2);
		}

		.status-badge {
			display: inline-flex;
			align-items: center;
			gap: 7px;
			min-height: 30px;
			border-radius: 999px;
			padding: 5px 10px;
			font-size: 12px;
			font-weight: 700;
			border: 1px solid var(--cms-border);
			color: #53615b;
			background: #ffffff;
			white-space: nowrap;
		}

		.status-badge.is-bootstrap {
			color: #17689b;
			border-color: #b9def1;
			background: #edf8fe;
		}

		.status-badge.is-mega {
			color: var(--cms-green);
			border-color: #bde5d4;
			background: var(--cms-green-soft);
		}

		.status-badge.is-none {
			color: #747a80;
			background: #f6f7f8;
		}

		.detail-strip {
			border-radius: 8px;
			background: rgba(33, 40, 45, .12);
			margin-top: 12px;
			padding: 18px 22px;
		}

		.form-label {
			color: var(--cms-green);
			font-weight: 500;
			font-size: 17px;
			margin-bottom: 8px;
		}

		.form-control,
		.form-select {
			border-color: #d5dfdb;
			border-radius: 8px;
			min-height: 46px;
			font-size: 17px;
		}

		.form-control:focus,
		.form-select:focus {
			border-color: #85c6aa;
			box-shadow: 0 0 0 .2rem rgba(24, 137, 95, .13);
		}

		.ph-btn-theme {
			border: 0;
			background: #1ca36f;
			color: #fff;
			border-radius: 8px;
			min-height: 46px;
			font-weight: 600;
			padding-inline: 18px;
		}

		.ph-btn-theme:hover,
		.ph-btn-theme:focus {
			background: #16865d;
			color: #fff;
		}

		.builder-layer {
			position: fixed;
			z-index: 1000;
			inset: 0;
			display: none;
			align-items: center;
			justify-content: center;
			padding: 24px;
			background: rgba(12, 23, 20, .46);
		}

		.builder-layer.is-open {
			display: flex;
		}

		.builder-dialog {
			width: min(1480px, calc(100vw - 48px));
			height: min(840px, calc(100vh - 48px));
			background: #ffffff;
			border: 1px solid rgba(255, 255, 255, .72);
			border-radius: 8px;
			box-shadow: 0 28px 80px rgba(10, 28, 22, .28);
			display: flex;
			flex-direction: column;
			overflow: hidden;
		}

		.builder-layer.is-fullscreen {
			padding: 12px;
		}

		.builder-layer.is-fullscreen .builder-dialog {
			width: calc(100vw - 24px);
			height: calc(100vh - 24px);
		}

		.builder-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 18px;
			border-bottom: 1px solid var(--cms-border);
			padding: 18px 22px;
			background: linear-gradient(180deg, #ffffff 0%, #fbfdfc 100%);
		}

		.builder-title-group {
			display: flex;
			align-items: center;
			gap: 14px;
			min-width: 0;
		}

		.builder-title-icon {
			width: 44px;
			height: 44px;
			border-radius: 8px;
			display: grid;
			place-items: center;
			color: var(--cms-green);
			background: var(--cms-green-soft);
			font-size: 19px;
		}

		.builder-title {
			margin: 0;
			color: var(--cms-green);
			font-size: 22px;
			font-weight: 700;
			letter-spacing: 0;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.builder-kicker {
			margin: 2px 0 0;
			color: var(--cms-muted);
			font-size: 13px;
		}

		.builder-header-actions {
			display: flex;
			align-items: center;
			gap: 10px;
			flex-wrap: wrap;
			justify-content: flex-end;
		}

		.builder-icon-btn {
			width: 38px;
			height: 38px;
			border: 1px solid var(--cms-border);
			background: #ffffff;
			color: #47524d;
			border-radius: 8px;
			display: grid;
			place-items: center;
		}

		.builder-icon-btn:hover,
		.builder-icon-btn:focus {
			border-color: #a8d2c1;
			color: var(--cms-green);
			background: #f7fcfa;
			outline: none;
		}

		.builder-body {
			min-height: 0;
			flex: 1;
			display: grid;
			grid-template-columns: minmax(360px, 430px) minmax(0, 1fr);
		}

		.builder-settings {
			min-width: 0;
			overflow: auto;
			border-right: 1px solid var(--cms-border);
			background: #ffffff;
		}

		.settings-type-region {
			position: sticky;
			top: 0;
			z-index: 2;
			padding: 20px 22px 18px;
			border-bottom: 1px solid var(--cms-border);
			background: #ffffff;
		}

		.settings-type-caption {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
			color: var(--cms-muted);
			font-size: 12px;
			margin: 0 0 12px;
		}

		.settings-scroll {
			padding: 2px 22px 24px;
		}

		.builder-preview {
			min-width: 0;
			overflow: hidden;
			display: flex;
			flex-direction: column;
			background: linear-gradient(180deg, #f7fbf9 0%, #eef6f3 100%);
		}

		.setting-section {
			border-bottom: 1px solid var(--cms-border-soft);
			padding-bottom: 18px;
			margin-bottom: 18px;
		}

		.setting-section:last-child {
			border-bottom: 0;
			margin-bottom: 0;
		}

		.section-label {
			color: #24362f;
			font-size: 12px;
			font-weight: 800;
			letter-spacing: .04em;
			text-transform: uppercase;
			margin: 0 0 10px;
		}

		.segmented {
			display: grid;
			grid-template-columns: repeat(3, minmax(0, 1fr));
			gap: 0;
			border: 1px solid #d8e1dd;
			border-radius: 8px;
			padding: 5px;
			background: #f8fbfa;
		}

		.segmented button {
			min-width: 0;
			min-height: 40px;
			border: 1px solid transparent;
			border-radius: 7px;
			background: transparent;
			color: #22342d;
			font-size: 13px;
			font-weight: 700;
		}

		.segmented button.is-active {
			color: #ffffff;
			background: #0d6efd;
			border-color: #0d6efd;
			box-shadow: 0 8px 18px rgba(13, 110, 253, .18);
		}

		.settings-accordion {
			border-top: 0;
		}

		.settings-accordion-item {
			border-bottom: 1px solid var(--cms-border-soft);
		}

		.settings-accordion-toggle {
			width: 100%;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			padding: 16px 0;
			border: 0;
			background: transparent;
			color: #21322d;
			font-size: 14px;
			font-weight: 800;
			text-align: left;
		}

		.settings-accordion-toggle:hover,
		.settings-accordion-toggle:focus {
			color: var(--cms-green);
			outline: none;
		}

		.settings-accordion-title {
			display: inline-flex;
			align-items: center;
			gap: 9px;
		}

		.settings-accordion-title i:first-child {
			width: 18px;
			color: var(--cms-green);
			text-align: center;
		}

		.settings-accordion-chevron {
			color: #76817d;
			font-size: 12px;
			transition: transform .18s ease;
		}

		.settings-accordion-toggle[aria-expanded="true"] .settings-accordion-chevron {
			transform: rotate(180deg);
		}

		.settings-accordion-panel {
			padding: 0 0 18px;
		}

		.settings-accordion-panel[hidden] {
			display: none !important;
		}

		.settings-panel-note {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			color: var(--cms-muted);
			font-size: 12px;
			margin: 0 0 14px;
		}

		.settings-panel-note strong {
			color: #32443d;
			font-size: 12px;
		}

		.caret-icon-fields {
			display: grid;
			gap: 12px;
			margin-top: 12px;
		}

		.caret-icon-file-status {
			display: block;
			min-height: 17px;
			color: var(--cms-muted);
			font-size: 11px;
			margin-top: 6px;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}

		.settings-accordion-panel .toggle-row {
			border-width: 0 0 1px;
			border-radius: 0;
			padding: 9px 0;
			background: transparent;
		}

		.settings-accordion-panel .toggle-row:last-child {
			border-bottom: 0;
		}

		.dropdown-toggle-icon {
			display: inline-block;
			min-width: 12px;
			margin-left: 7px;
			text-align: center;
		}

		img.dropdown-toggle-icon {
			width: 14px;
			height: 14px;
			object-fit: contain;
			vertical-align: -2px;
		}

		.choice-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 10px;
		}

		.layout-choice {
			text-align: left;
			border: 1px solid #dbe4df;
			border-radius: 8px;
			background: #ffffff;
			padding: 12px;
			color: #25332f;
			min-height: 86px;
		}

		.layout-choice:hover,
		.layout-choice:focus {
			border-color: #9ed4bd;
			outline: none;
		}

		.layout-choice.is-active {
			border-color: var(--cms-green-2);
			background: var(--cms-green-soft);
			box-shadow: inset 0 0 0 1px rgba(24, 137, 95, .18);
		}

		.layout-choice strong {
			display: block;
			color: var(--cms-green);
			font-size: 13px;
			margin-bottom: 5px;
		}

		.layout-choice span {
			display: block;
			color: #66746f;
			font-size: 12px;
			line-height: 1.35;
		}

		.control-row {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 12px;
		}

		.layout-option-panel {
			border: 1px solid #dbe4df;
			border-radius: 8px;
			background: #fbfdfc;
			padding: 12px;
		}

		.layout-option-title {
			color: var(--cms-green);
			font-size: 14px;
			font-weight: 800;
			margin: 0 0 4px;
		}

		.layout-option-hint {
			color: var(--cms-muted);
			font-size: 12px;
			line-height: 1.35;
			margin: 0 0 12px;
		}

		.layout-option-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 12px;
		}

		.mini-label {
			display: block;
			color: var(--cms-green);
			font-size: 13px;
			font-weight: 600;
			margin-bottom: 7px;
		}

		.form-select-sm,
		.form-control-sm {
			min-height: 38px;
			border-radius: 8px;
			font-size: 13px;
		}

		.toggle-row {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			border: 1px solid var(--cms-border-soft);
			border-radius: 8px;
			padding: 10px 12px;
			margin-bottom: 9px;
			background: #fbfdfc;
		}

		.toggle-row span {
			color: #2c3a34;
			font-size: 13px;
			font-weight: 600;
		}

		.item-editor {
			display: grid;
			gap: 9px;
		}

		.editor-row {
			display: grid;
			grid-template-columns: 34px minmax(0, 1fr) auto;
			gap: 10px;
			align-items: center;
			border: 1px solid var(--cms-border-soft);
			background: #fbfdfc;
			border-radius: 8px;
			padding: 9px;
		}

		.editor-row i {
			color: var(--cms-green);
			text-align: center;
		}

		.editor-text strong {
			display: block;
			color: #27342f;
			font-size: 13px;
		}

		.editor-text small {
			color: var(--cms-muted);
			font-size: 12px;
		}

		.editor-action {
			width: 30px;
			height: 30px;
			border: 1px solid #dbe4df;
			border-radius: 7px;
			background: #ffffff;
			color: var(--cms-green);
		}

		.preview-toolbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			padding: 18px 20px;
			border-bottom: 1px solid #dce6e1;
			background: rgba(255, 255, 255, .76);
		}

		.preview-title {
			color: #1e2e28;
			font-size: 17px;
			font-weight: 800;
			margin: 0;
		}

		.device-control {
			display: inline-flex;
			border: 1px solid #d8e1dd;
			background: #ffffff;
			border-radius: 8px;
			padding: 4px;
		}

		.device-control button {
			border: 0;
			background: transparent;
			color: #52645d;
			border-radius: 7px;
			padding: 7px 11px;
			font-size: 13px;
			font-weight: 700;
		}

		.device-control button.is-active {
			color: #ffffff;
			background: var(--cms-green);
		}

		.preview-stage {
			min-height: 0;
			flex: 1;
			overflow: auto;
			padding: 26px;
		}

		.preview-canvas {
			width: min(100%, 960px);
			min-height: 620px;
			margin: 0 auto;
			border: 1px solid #d8e1dd;
			border-radius: 8px;
			background: #ffffff;
			box-shadow: 0 18px 42px rgba(18, 40, 32, .12);
			overflow: hidden;
			transition: width .2s ease;
		}

		.preview-canvas.is-tablet {
			width: min(100%, 740px);
		}

		.preview-canvas.is-mobile {
			width: min(100%, 390px);
		}

		.site-hero {
			height: 150px;
			background:
				radial-gradient(circle at 18% 20%, rgba(255, 255, 255, .20) 0 2px, transparent 3px),
				linear-gradient(90deg, rgba(17, 91, 66, .96), rgba(23, 63, 80, .82));
			background-size: cover;
			color: #ffffff;
			display: flex;
			align-items: flex-end;
			padding: 24px;
		}

		.preview-nav {
			position: relative;
			z-index: 2;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 20px;

										<div id="toggleIconUploadWrapper" hidden>
											<label class="mini-label" for="toggleIconFile">Dropdown icon upload</label>
											<input class="form-control form-control-sm" id="toggleIconFile" type="file" accept="image/*,.svg">
											<span class="caret-icon-file-status" id="toggleIconFileName">No file selected</span>
										</div>
										<div id="toggleIconCustomWrapper" hidden>
											<label class="mini-label" for="toggleIconCustom">Dropdown icon custom</label>
											<input class="form-control form-control-sm" id="toggleIconCustom" type="text" value="fas fa-chevron-down">
										</div>
									</div>
								</div>
							</section>

							<section class="settings-accordion-item" id="placementSettings">
								<button class="settings-accordion-toggle" type="button" data-accordion-toggle="placement" aria-expanded="true" aria-controls="placementPanel">
									<span class="settings-accordion-title"><i class="fas fa-arrows-alt-h"></i>Placement &amp; Size</span>
									<i class="fas fa-chevron-down settings-accordion-chevron"></i>
								</button>
								<div class="settings-accordion-panel" id="placementPanel">
									<div id="bootstrapSettings">
										<div class="control-row">
											<div>
												<label class="mini-label" for="bootstrapAlign">Dropdown align</label>
												<select class="form-select form-select-sm" id="bootstrapAlign">
													<option value="right">Right</option>
													<option value="center">Center</option>
													<option value="left">Left</option>
												</select>
											</div>
											<div>
												<label class="mini-label" for="bootstrapWidth">Menu width</label>
												<select class="form-select form-select-sm" id="bootstrapWidth">
													<option value="260">260px</option>
													<option value="300">300px</option>
													<option value="340">340px</option>
												</select>
											</div>
										</div>
									</div>
									<div id="megaSettings">
										<label class="mini-label" for="megaWidth">Width mode</label>
										<select class="form-select form-select-sm" id="megaWidth">
											<option value="contained">Container</option>
											<option value="wide">Wide</option>
											<option value="full">Full width</option>
										</select>
									</div>
								</div>
							</section>

							<section class="settings-accordion-item" id="layoutSettings">
								<button class="settings-accordion-toggle" type="button" data-accordion-toggle="layout" aria-expanded="false" aria-controls="layoutPanel">
									<span class="settings-accordion-title"><i class="fas fa-th-large"></i>Mega Menu Layout</span>
									<i class="fas fa-chevron-down settings-accordion-chevron"></i>
								</button>
								<div class="settings-accordion-panel" id="layoutPanel" hidden>
									<div id="megaLayoutSettings">
										<div class="choice-grid" id="megaLayoutGroup">
											<button class="layout-choice" type="button" data-layout="columns"><strong>Columns</strong><span>Menu link dikelompokkan dalam beberapa kolom.</span></button>
											<button class="layout-choice" type="button" data-layout="cards"><strong>Cards</strong><span>Konten menu tampil sebagai grid item visual.</span></button>
											<button class="layout-choice" type="button" data-layout="featured"><strong>Featured + Links</strong><span>Satu area highlight dan daftar link di sampingnya.</span></button>
											<button class="layout-choice" type="button" data-layout="category"><strong>Category Grid</strong><span>Kategori ringkas untuk banyak area konten.</span></button>
										</div>
										<div class="mt-3" id="layoutOptionSettings"></div>
										<div class="mt-3" id="displaySettings">
											<p class="section-label">Display Options</p>
											<div class="control-row mb-3">
												<div>
													<label class="mini-label" for="imagePosition">Image/Icon Position</label>
													<select class="form-select form-select-sm" id="imagePosition"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select>
												</div>
												<div>
													<label class="mini-label" for="titlePosition">Title Position</label>
													<select class="form-select form-select-sm" id="titlePosition"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select>
												</div>
												<div>
													<label class="mini-label" for="descriptionPosition">Description Position</label>
													<select class="form-select form-select-sm" id="descriptionPosition"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select>
												</div>
											</div>
											<label class="toggle-row"><span>Show icons</span><input class="form-check-input m-0" id="showIcons" type="checkbox" checked></label>
											<label class="toggle-row"><span>Show descriptions</span><input class="form-check-input m-0" id="showDescriptions" type="checkbox" checked></label>
											<label class="toggle-row"><span>Highlight active parent</span><input class="form-check-input m-0" id="highlightParent" type="checkbox" checked></label>
										</div>
									</div>
								</div>
							</section>

							<section class="settings-accordion-item" id="submenuSettings">
								<button class="settings-accordion-toggle" type="button" data-accordion-toggle="items" aria-expanded="false" aria-controls="submenuPanel">
									<span class="settings-accordion-title"><i class="fas fa-list-ul"></i>Submenu Items</span>
									<i class="fas fa-chevron-down settings-accordion-chevron"></i>
								</button>
								<div class="settings-accordion-panel" id="submenuPanel" hidden>
									<p class="settings-panel-note"><span>Current submenu list</span><strong id="submenuPanelCount">2 items</strong></p>
									<div class="item-editor" id="itemEditor"></div>
									<button class="btn-outline-soft w-100 mt-3" id="addMockItem" type="button"><i class="fas fa-plus me-2"></i>Add sample item</button>
								</div>
							</section>
						</div>
					</div>
				</aside>

				<section class="builder-preview">
					<div class="preview-toolbar">
						<h3 class="preview-title">Live Preview</h3>
						<div class="device-control" id="deviceGroup" aria-label="Preview device">
							<button type="button" data-device="desktop">Desktop</button>
							<button type="button" data-device="tablet">Tablet</button>
							<button type="button" data-device="mobile">Mobile</button>
						</div>
					</div>
					<div class="preview-stage">
						<div class="preview-canvas" id="previewCanvas"></div>
					</div>
				</section>
			</div>

			<footer class="builder-footer">
				<div class="footer-left">
					<button class="btn-outline-soft" id="closeBuilderBottom" type="button">Cancel</button>
					<button class="btn-danger-soft" id="resetBuilder" type="button"><i class="fas fa-undo me-2"></i>Reset</button>
				</div>
				<div class="footer-right">
					<button class="btn-outline-soft" type="button"><i class="fas fa-eye me-2"></i>Preview in Header Settings</button>
					<button class="ph-btn-theme" id="saveBuilder" type="button"><i class="fas fa-save me-2"></i>Save Dropdown</button>
				</div>
			</footer>
		</section>
	</div>

	<script>
		const menus = [
			{
				id: 'articles',
				name: 'Manage Articles',
				icon: 'far fa-newspaper',
				status: 'bootstrap',
				config: {
					type: 'bootstrap',
					layout: 'columns',
					device: 'desktop',
					bootstrapAlign: 'right',
					bootstrapSource: 'submenu',
					bootstrapTrigger: 'hover',
					bootstrapWidth: '260',
					megaColumns: '3',
					megaWidth: 'contained',
					showIcons: true,
					showDescriptions: true,
					highlightParent: true,
					items: [
						{ title: 'All Articles', desc: 'List and editorial archive', icon: 'far fa-newspaper' },
						{ title: 'Create Article', desc: 'Start a new article entry', icon: 'fas fa-pen-nib' },
						{ title: 'Categories', desc: 'Article grouping', icon: 'fas fa-folder-open' }
					]
				}
			},
			{
				id: 'about-us',
				name: 'About Us',
				icon: 'fas fa-info-circle',
				status: 'mega',
				config: {
					type: 'mega',
					layout: 'cards',
					device: 'desktop',
					bootstrapAlign: 'right',
					bootstrapSource: 'submenu',
					bootstrapTrigger: 'hover',
					bootstrapWidth: '260',
					megaColumns: '3',
					cardColumns: '2',
					megaWidth: 'contained',
					showIcons: true,
					showDescriptions: true,
					highlightParent: true,
					items: [
						{ title: 'About Us 1', desc: 'Company profile and introduction', icon: 'fas fa-plus' },
						{ title: 'About Us 2', desc: 'Team, values, and company story', icon: 'fas fa-users' }
					]
				}
			},
			{
				id: 'files',
				name: 'File Manager',
				icon: 'far fa-file-alt',
				status: 'none',
				config: {
					type: 'mega',
					layout: 'columns',
					device: 'desktop',
					bootstrapAlign: 'right',
					bootstrapSource: 'submenu',
					bootstrapTrigger: 'hover',
					bootstrapWidth: '260',
					megaColumns: '3',
					megaWidth: 'contained',
					showIcons: true,
					showDescriptions: true,
					highlightParent: true,
					items: [
						{ title: 'Documents', desc: 'PDF and document files', icon: 'far fa-file-alt' },
						{ title: 'Images', desc: 'Uploaded image assets', icon: 'far fa-images' },
						{ title: 'Downloads', desc: 'Public downloadable files', icon: 'fas fa-download' },
						{ title: 'Storage Settings', desc: 'Path and driver rules', icon: 'fas fa-hdd' }
					]
				}
			}
		];

		let activeMenu = menus[1];
		let draft = cloneConfig(activeMenu.config);

		const parentMenuList = document.getElementById('parentMenuList');
		const layer = document.getElementById('dropdownBuilderLayer');
		const builderTitle = document.getElementById('builderTitle');
		const builderKicker = document.getElementById('builderKicker');
		const builderStatus = document.getElementById('builderStatus');
		const previewCanvas = document.getElementById('previewCanvas');
		const itemEditor = document.getElementById('itemEditor');
		const layoutOptionSettings = document.getElementById('layoutOptionSettings');
		const submenuCount = document.getElementById('submenuCount');
		const submenuPanelCount = document.getElementById('submenuPanelCount');
		const settingsMode = document.getElementById('settingsMode');
		const toggleIconFile = document.getElementById('toggleIconFile');
		const toggleIconFileName = document.getElementById('toggleIconFileName');
		const toggleIconUploadWrapper = document.getElementById('toggleIconUploadWrapper');
		const toggleIconCustomWrapper = document.getElementById('toggleIconCustomWrapper');
		const accordionState = {
			appearance: true,
			placement: true,
			layout: false,
			items: false
		};

		const fields = {
			bootstrapAlign: document.getElementById('bootstrapAlign'),
			bootstrapWidth: document.getElementById('bootstrapWidth'),
			megaWidth: document.getElementById('megaWidth'),
			dropdownMarginTop: document.getElementById('dropdownMarginTop'),
			arrowSize: document.getElementById('arrowSize'),
			showArrow: document.getElementById('showArrow'),
			toggleIconType: document.getElementById('toggleIconType'),
			toggleIconCustom: document.getElementById('toggleIconCustom'),
			imagePosition: document.getElementById('imagePosition'),
			titlePosition: document.getElementById('titlePosition'),
			descriptionPosition: document.getElementById('descriptionPosition'),
			showIcons: document.getElementById('showIcons'),
			showDescriptions: document.getElementById('showDescriptions'),
			highlightParent: document.getElementById('highlightParent')
		};

		function defaultConfig() {
			return {
				type: 'none',
				layout: 'columns',
				device: 'desktop',
				bootstrapAlign: 'right',
				bootstrapSource: 'submenu',
				bootstrapTrigger: 'hover',
				bootstrapWidth: '260',
				megaColumns: '3',
				megaWidth: 'contained',
				dropdownMarginTop: '12',
				arrowSize: '10',
				showArrow: true,
				toggleIconType: 'default',
				toggleIconCustom: 'fas fa-chevron-down',
				toggleIconFileName: '',
				toggleIconUploadPreview: '',
				imagePosition: 'left',
				titlePosition: 'left',
				descriptionPosition: 'left',
				showIcons: true,
				showDescriptions: true,
				highlightParent: true,
				columnTitleMode: 'show',
				columnDivider: 'soft',
				columnDensity: 'comfortable',
				cardColumns: '3',
				cardStyle: 'bordered',
				cardShadow: 'soft',
				cardMediaStyle: 'icon',
				featuredPosition: 'left',
				featuredLinkGroups: '2',
				featuredBadge: 'show',
				categoryColumns: '4',
				categoryStyle: 'bordered',
				showItemCount: true,
				items: []
			};
		}

		function cloneConfig(config) {
			const cloned = JSON.parse(JSON.stringify(config || {}));
			return { ...defaultConfig(), ...cloned, items: cloned.items || [] };
		}

		function statusText(type) {
			if (type === 'bootstrap') return 'Bootstrap Dropdown';
			if (type === 'mega') return 'Mega Menu';
			return 'No Dropdown';
		}

		function renderParentMenuList() {
			parentMenuList.innerHTML = menus.map(menu => `
				<div class="parent-row" data-menu-row="${menu.id}">
					<div class="row g-2 align-items-center">
						<div class="col-lg-5">
							<div class="parent-name">
								<i class="fas fa-arrows-alt-v drag-handle"></i>
								<span>|</span>
								<i class="${menu.icon}"></i>
								<span>${menu.name}</span>
							</div>
						</div>
						<div class="col-lg-3">
							${renderStatusBadge(menu.config.type)}
						</div>
						<div class="col-lg-4">
							<div class="parent-actions">
								<button class="link-action" type="button">View detail</button>
								<span class="divider">|</span>
								<button class="link-action dropdown-action" type="button" data-open-builder="${menu.id}">Dropdown</button>
								<span class="divider">|</span>
								<button class="link-action" type="button">Remove</button>
							</div>
						</div>
					</div>
					${menu.id === 'files' ? renderDetailStrip(menu) : ''}
				</div>
			`).join('');

			document.querySelectorAll('[data-open-builder]').forEach(button => {
				button.addEventListener('click', () => {
					const menu = menus.find(item => item.id === button.dataset.openBuilder);
					openBuilder(menu);
				});
			});
		}

		function renderStatusBadge(type) {
			return `<span class="status-badge is-${type}"><i class="fas fa-circle"></i>${statusText(type)}</span>`;
		}

		function renderDetailStrip(menu) {
			return `
				<div class="detail-strip">
					<div class="row g-3">
						<div class="col-12">
							<label class="form-label">Category Menu</label>
							<select class="form-select"><option>Main Frontend Menu</option></select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Parent Menu Name</label>
							<input class="form-control" type="text" value="${menu.name}">
						</div>
						<div class="col-md-6">
							<label class="form-label">Parent Menu Link</label>
							<input class="form-control" type="text" value="filemanager">
						</div>
					</div>
				</div>
			`;
		}

		function openBuilder(menu) {
			activeMenu = menu;
			draft = cloneConfig(menu.config);
			syncControlsFromDraft();
			layer.classList.add('is-open');
			layer.setAttribute('aria-hidden', 'false');
			document.body.classList.add('body-lock');
			renderBuilder();
		}

		function closeBuilder() {
			layer.classList.remove('is-open', 'is-fullscreen');
			layer.setAttribute('aria-hidden', 'true');
			document.body.classList.remove('body-lock');
		}

		function syncControlsFromDraft() {
			Object.entries(fields).forEach(([key, field]) => {
				if (field.type === 'checkbox') {
					field.checked = Boolean(draft[key]);
				} else {
					field.value = draft[key];
				}
			});
		}

		function syncDraftFromControls() {
			Object.entries(fields).forEach(([key, field]) => {
				draft[key] = field.type === 'checkbox' ? field.checked : field.value;
			});
		}

		function syncSettingsAccordion() {
			Object.entries(accordionState).forEach(([key, isOpen]) => {
				const button = document.querySelector(`[data-accordion-toggle="${key}"]`);
				const panel = document.getElementById(`${key === 'items' ? 'submenu' : key}Panel`);
				if (!button || !panel) return;
				button.setAttribute('aria-expanded', String(isOpen));
				panel.hidden = !isOpen;
			});
		}

		function renderBuilder() {
			syncDraftFromControls();
			builderTitle.textContent = 'Manage Dropdown Menu';
			builderKicker.textContent = activeMenu.name;
			builderStatus.className = `status-badge is-${draft.type}`;
			builderStatus.innerHTML = `<i class="fas fa-circle"></i>${statusText(draft.type)}`;
			const itemCountLabel = `${draft.items.length} submenu item${draft.items.length === 1 ? '' : 's'}`;
			submenuCount.textContent = itemCountLabel;
			submenuPanelCount.textContent = `${draft.items.length} item${draft.items.length === 1 ? '' : 's'}`;
			settingsMode.textContent = draft.type === 'bootstrap' ? 'Bootstrap 5' : draft.type === 'mega' ? 'Mega Menu' : 'None';

			document.querySelectorAll('#dropdownTypeGroup button').forEach(button => {
				button.classList.toggle('is-active', button.dataset.type === draft.type);
			});

			document.querySelectorAll('#megaLayoutGroup button').forEach(button => {
				button.classList.toggle('is-active', button.dataset.layout === draft.layout);
			});

			document.getElementById('dropdownBoxSettings').style.display = draft.type === 'none' ? 'none' : 'block';
			document.getElementById('placementSettings').style.display = draft.type === 'none' ? 'none' : 'block';
			document.getElementById('bootstrapSettings').style.display = draft.type === 'bootstrap' ? 'block' : 'none';
			document.getElementById('megaSettings').style.display = draft.type === 'mega' ? 'block' : 'none';
			document.getElementById('layoutSettings').style.display = draft.type === 'mega' ? 'block' : 'none';
			layoutOptionSettings.style.display = draft.type === 'mega' ? 'block' : 'none';
			document.getElementById('displaySettings').style.display = draft.type === 'mega' ? 'block' : 'none';
			toggleIconUploadWrapper.hidden = draft.toggleIconType !== 'upload';
			toggleIconCustomWrapper.hidden = draft.toggleIconType !== 'custom';
			toggleIconFileName.textContent = draft.toggleIconFileName || 'No file selected';
			syncSettingsAccordion();

			document.querySelectorAll('#deviceGroup button').forEach(button => {
				button.classList.toggle('is-active', button.dataset.device === draft.device);
			});

			renderLayoutOptions();
			renderItemEditor();
			renderPreview();
		}

		function optionSelect(name, label, options) {
			return `
				<div>
					<label class="mini-label" for="${name}">${label}</label>
					<select class="form-select form-select-sm" id="${name}" data-layout-option="${name}">
						${options.map(option => `
							<option value="${option.value}" ${String(draft[name]) === String(option.value) ? 'selected' : ''}>${option.label}</option>
						`).join('')}
					</select>
				</div>
			`;
		}

		function optionToggle(name, label) {
			return `
				<label class="toggle-row mb-0">
					<span>${label}</span>
					<input class="form-check-input m-0" type="checkbox" data-layout-option="${name}" ${draft[name] ? 'checked' : ''}>
				</label>
			`;
		}

		function renderLayoutOptions() {
			if (draft.type !== 'mega') {
				layoutOptionSettings.innerHTML = '';
				return;
			}

			const commonHeader = {
				columns: {
					title: 'Columns Layout Options',
					hint: 'Mengatur struktur kolom, label grup, divider, dan kepadatan link.'
				},
				cards: {
					title: 'Cards Layout Options',
					hint: 'Mengatur jumlah card, gaya card, bayangan, dan bentuk media.'
				},
				featured: {
					title: 'Featured Layout Options',
					hint: 'Mengatur posisi area highlight, jumlah grup link, dan badge featured.'
				},
				category: {
					title: 'Category Grid Options',
					hint: 'Mengatur jumlah tile kategori, style tile, dan counter item.'
				}
			}[draft.layout];

			let controls = '';
			if (draft.layout === 'columns') {
				controls = `
					${optionSelect('megaColumns', 'Columns', [
						{ value: '2', label: '2 Columns' },
						{ value: '3', label: '3 Columns' },
						{ value: '4', label: '4 Columns' }
					])}
					${optionSelect('columnTitleMode', 'Column Title', [
						{ value: 'show', label: 'Show' },
						{ value: 'hide', label: 'Hide' }
					])}
					${optionSelect('columnDivider', 'Column Divider', [
						{ value: 'none', label: 'None' },
						{ value: 'soft', label: 'Soft Divider' },
						{ value: 'strong', label: 'Strong Divider' }
					])}
					${optionSelect('columnDensity', 'Item Density', [
						{ value: 'compact', label: 'Compact' },
						{ value: 'comfortable', label: 'Comfortable' }
					])}
				`;
			} else if (draft.layout === 'cards') {
				controls = `
					${optionSelect('cardColumns', 'Cards Per Row', [
						{ value: '2', label: '2 Cards' },
						{ value: '3', label: '3 Cards' },
						{ value: '4', label: '4 Cards' }
					])}
					${optionSelect('cardStyle', 'Card Style', [
						{ value: 'bordered', label: 'Bordered' },
						{ value: 'filled', label: 'Filled' },
						{ value: 'minimal', label: 'Minimal' }
					])}
					${optionSelect('cardShadow', 'Card Shadow', [
						{ value: 'none', label: 'None' },
						{ value: 'soft', label: 'Soft' }
					])}
					${optionSelect('cardMediaStyle', 'Media Shape', [
						{ value: 'icon', label: 'Icon Box' },
						{ value: 'plain', label: 'Plain Icon' }
					])}
				`;
			} else if (draft.layout === 'featured') {
				controls = `
					${optionSelect('featuredPosition', 'Featured Position', [
						{ value: 'left', label: 'Left' },
						{ value: 'right', label: 'Right' },
						{ value: 'top', label: 'Top' }
					])}
					${optionSelect('featuredLinkGroups', 'Link Groups', [
						{ value: '1', label: '1 Group' },
						{ value: '2', label: '2 Groups' },
						{ value: '3', label: '3 Groups' }
					])}
					${optionSelect('featuredBadge', 'Featured Badge', [
						{ value: 'show', label: 'Show' },
						{ value: 'hide', label: 'Hide' }
					])}
					${optionSelect('columnDensity', 'Link Density', [
						{ value: 'compact', label: 'Compact' },
						{ value: 'comfortable', label: 'Comfortable' }
					])}
				`;
			} else {
				controls = `
					${optionSelect('categoryColumns', 'Tiles Per Row', [
						{ value: '2', label: '2 Tiles' },
						{ value: '3', label: '3 Tiles' },
						{ value: '4', label: '4 Tiles' },
						{ value: '5', label: '5 Tiles' }
					])}
					${optionSelect('categoryStyle', 'Tile Style', [
						{ value: 'bordered', label: 'Bordered' },
						{ value: 'filled', label: 'Filled' },
						{ value: 'minimal', label: 'Minimal' }
					])}
					${optionToggle('showItemCount', 'Show item count')}
				`;
			}

			layoutOptionSettings.innerHTML = `
				<p class="section-label">Layout Options</p>
				<div class="layout-option-panel">
					<p class="layout-option-title">${commonHeader.title}</p>
					<p class="layout-option-hint">${commonHeader.hint}</p>
					<div class="layout-option-grid">${controls}</div>
				</div>
			`;
		}

		function renderItemEditor() {
			itemEditor.innerHTML = draft.items.map((item, index) => `
				<div class="editor-row">
					<i class="${item.icon}"></i>
					<div class="editor-text">
						<strong>${item.title}</strong>
						<small>${item.desc}</small>
					</div>
					<button class="editor-action" type="button" data-remove-item="${index}" aria-label="Remove item"><i class="fas fa-times"></i></button>
				</div>
			`).join('');

			document.querySelectorAll('[data-remove-item]').forEach(button => {
				button.addEventListener('click', () => {
					if (draft.items.length <= 1) return;
					draft.items.splice(Number(button.dataset.removeItem), 1);
					renderBuilder();
				});
			});
		}

		function dropdownToggleIconMarkup() {
			if (draft.toggleIconType === 'upload' && draft.toggleIconUploadPreview) {
				return `<img class="dropdown-toggle-icon" src="${draft.toggleIconUploadPreview}" alt="">`;
			}

			let iconClass = 'fas fa-chevron-down';
			if (draft.toggleIconType === 'upload' && draft.toggleIconFileName) {
				iconClass = 'far fa-image';
			} else if (draft.toggleIconType === 'custom') {
				const rawValue = String(draft.toggleIconCustom || '');
				const classMatch = rawValue.match(/class\s*=\s*["']([^"']+)["']/i);
				const normalized = (classMatch ? classMatch[1] : rawValue).replace(/[^a-zA-Z0-9\-\s]/g, ' ').trim();
				iconClass = normalized || iconClass;
			}

			return `<i class="${iconClass} dropdown-toggle-icon" aria-hidden="true"></i>`;
		}

		function renderPreview() {
			previewCanvas.className = `preview-canvas is-${draft.device}`;
			const dropdownMarkup = getDropdownMarkup();

			previewCanvas.innerHTML = `
				<nav class="preview-nav">
					<div class="preview-links">
						<button class="preview-link" type="button">Homepage</button>
						<button class="preview-link" type="button">Products</button>
						<button class="preview-link ${draft.highlightParent ? 'is-active' : ''}" data-dropdown-anchor type="button">${activeMenu.name}${dropdownToggleIconMarkup()}</button>
						<button class="preview-link" type="button">Contact</button>
					</div>
					<button class="mobile-menu-button" data-mobile-dropdown-anchor type="button"><i class="fas fa-bars"></i></button>
				</nav>
				${dropdownMarkup}
				<div class="preview-content">
					<div class="content-box">
						<h3>Homepage</h3>
						<p>Parent menu dapat tetap dipakai sebagai link utama.</p>
					</div>
					<div class="content-box">
						<h3>Products</h3>
						<p>Dropdown mengambil struktur dari menu frontend.</p>
					</div>
					<div class="content-box">
						<h3>Contact</h3>
						<p>State hover dan active terlihat di header preview.</p>
					</div>
				</div>
			`;
			positionDropdownArrow();
			requestAnimationFrame(positionDropdownArrow);
		}

		function positionDropdownArrow() {
			const surface = previewCanvas.querySelector('[data-dropdown-surface]');
			const arrow = previewCanvas.querySelector('.dropdown-arrow');
			if (!surface || !arrow) return;

			let anchor = previewCanvas.querySelector('[data-dropdown-anchor]');
			if (!anchor || anchor.getBoundingClientRect().width === 0) {
				anchor = previewCanvas.querySelector('[data-mobile-dropdown-anchor]');
			}
			if (!anchor) return;

			const surfaceRect = surface.getBoundingClientRect();
			const anchorRect = anchor.getBoundingClientRect();
			const arrowSize = Math.max(8, Math.round(Number(draft.arrowSize || 10) * 1.45));
			const minX = arrowSize + 8;
			const maxX = Math.max(minX, surfaceRect.width - arrowSize - 8);
			const anchorCenter = anchorRect.left + (anchorRect.width / 2);
			const x = Math.max(minX, Math.min(maxX, anchorCenter - surfaceRect.left));
			surface.style.setProperty('--dropdown-arrow-x', `${x}px`);
		}

		function getDropdownMarkup() {
			if (draft.type === 'none') {
				return `<div class="empty-dropdown">Dropdown belum aktif untuk parent menu ini.</div>`;
			}

			if (draft.type === 'bootstrap') {
				return `
					<div class="dropdown-surface ${draft.showArrow ? 'has-arrow' : ''} bootstrap-dropdown align-${draft.bootstrapAlign}" data-dropdown-surface style="width: ${draft.bootstrapWidth}px; ${dropdownSurfaceStyle()}">
						${dropdownArrowMarkup()}
						${draft.items.map(item => `
							<a class="dropdown-item-preview" href="#">
								${draft.showIcons ? `<i class="${item.icon}"></i>` : ''}
								<span>${item.title}</span>
							</a>
						`).join('')}
					</div>
				`;
			}

			const wideStyle = draft.megaWidth === 'full'
				? 'width: calc(100% - 24px); margin-left: 12px; margin-right: 12px;'
				: draft.megaWidth === 'wide'
					? 'width: calc(100% - 48px);'
					: '';
			return `<div class="dropdown-surface ${draft.showArrow ? 'has-arrow' : ''} mega-dropdown" data-dropdown-surface style="${wideStyle} ${dropdownSurfaceStyle()}">${dropdownArrowMarkup()}${getMegaMarkup()}</div>`;
		}

		function dropdownSurfaceStyle() {
			const margin = Math.max(0, Number(draft.dropdownMarginTop || 0));
			return `--dropdown-gap: ${margin}px; margin-top: ${margin}px;`;
		}

		function dropdownArrowMarkup() {
			if (!draft.showArrow) return '';
			const size = Math.max(8, Math.round(Number(draft.arrowSize || 10) * 1.45));
			return `<span class="dropdown-arrow" style="--arrow-size: ${size}px"></span>`;
		}

		function alignmentClasses(extra = '') {
			return [
				`media-pos-${draft.imagePosition}`,
				`title-pos-${draft.titlePosition}`,
				`desc-pos-${draft.descriptionPosition}`,
				extra
			].filter(Boolean).join(' ');
		}

		function mediaMarkup(item, large = false) {
			if (!draft.showIcons) return '';
			const plainClass = draft.cardMediaStyle === 'plain' ? ' bg-transparent' : '';
			return `<span class="menu-media${large ? ' is-large' : ''}${plainClass}"><i class="${item.icon}"></i></span>`;
		}

		function copyMarkup(item) {
			return `
				<span class="menu-copy">
					<strong class="menu-title">${item.title}</strong>
					${draft.showDescriptions ? `<small class="menu-desc">${item.desc}</small>` : ''}
				</span>
			`;
		}

		function itemLink(item) {
			return `
				<a class="mega-link ${alignmentClasses(draft.columnDensity === 'compact' ? 'is-compact' : '')}" href="#">
					${mediaMarkup(item)}
					${copyMarkup(item)}
				</a>
			`;
		}

		function getMegaMarkup() {
			if (draft.layout === 'cards') {
				return `
					<div class="mega-card-grid card-cols-${draft.cardColumns}">
						${draft.items.map(item => `
							<div class="mega-card-item ${alignmentClasses(`card-style-${draft.cardStyle} card-shadow-${draft.cardShadow}`)}">
								${mediaMarkup(item)}
								${copyMarkup(item)}
							</div>
						`).join('')}
					</div>
				`;
			}

			if (draft.layout === 'featured') {
				const featuredItem = {
					title: activeMenu.name,
					desc: 'Kelola konten utama langsung dari navigation menu.',
					icon: activeMenu.icon
				};
				const groups = splitItems(draft.items, Number(draft.featuredLinkGroups));
				return `
					<div class="mega-featured pos-${draft.featuredPosition}">
						<div class="feature-tile ${alignmentClasses()}">
							${mediaMarkup(featuredItem, true)}
							<span class="menu-copy">
								${draft.featuredBadge === 'show' ? '<small class="text-uppercase opacity-75 mb-2 d-block">Featured</small>' : ''}
								<strong class="menu-title">${featuredItem.title}</strong>
								${draft.showDescriptions ? `<span class="menu-desc mt-2 opacity-75 d-block">${featuredItem.desc}</span>` : ''}
							</span>
						</div>
						<div class="mega-grid cols-${draft.featuredLinkGroups}">
							${groups.map((group, index) => `
								<div>
									<div class="mega-column-title">Group ${index + 1}</div>
									${group.map(itemLink).join('')}
								</div>
							`).join('')}
						</div>
					</div>
				`;
			}

			if (draft.layout === 'category') {
				return `
					<div class="category-grid category-cols-${draft.categoryColumns}">
						${draft.items.map((item, index) => `
							<a class="category-tile style-${draft.categoryStyle} ${alignmentClasses()} text-decoration-none" href="#">
								${mediaMarkup(item)}
								<span class="menu-copy">
									<strong class="menu-title">${item.title}</strong>
									${draft.showDescriptions ? `<small class="menu-desc">${item.desc}</small>` : ''}
									${draft.showItemCount ? `<span class="category-count mt-2">${index + 3} items</span>` : ''}
								</span>
							</a>
						`).join('')}
					</div>
				`;
			}

			const columnClass = draft.megaColumns === '4' ? 'cols-4' : 'cols-3';
			const groups = splitItems(draft.items, Number(draft.megaColumns));
			return `
				<div class="mega-grid ${draft.megaColumns === '2' ? 'cols-2' : columnClass}">
					${groups.map((group, index) => `
						<div class="mega-column ${draft.columnDivider !== 'none' ? `divider-${draft.columnDivider}` : ''}">
							${draft.columnTitleMode === 'show' ? `<div class="mega-column-title">Column ${index + 1}</div>` : ''}
							${group.map(itemLink).join('')}
						</div>
					`).join('')}
				</div>
			`;
		}

		function splitItems(items, count) {
			const groups = Array.from({ length: count }, () => []);
			items.forEach((item, index) => groups[index % count].push(item));
			return groups;
		}

		document.getElementById('dropdownTypeGroup').addEventListener('click', event => {
			const button = event.target.closest('[data-type]');
			if (!button) return;
			draft.type = button.dataset.type;
			renderBuilder();
		});

		document.getElementById('settingsAccordion').addEventListener('click', event => {
			const button = event.target.closest('[data-accordion-toggle]');
			if (!button) return;
			const section = button.dataset.accordionToggle;
			accordionState[section] = !accordionState[section];
			syncSettingsAccordion();
		});

		document.getElementById('megaLayoutGroup').addEventListener('click', event => {
			const button = event.target.closest('[data-layout]');
			if (!button) return;
			draft.layout = button.dataset.layout;
			renderBuilder();
		});

		layoutOptionSettings.addEventListener('input', event => {
			const control = event.target.closest('[data-layout-option]');
			if (!control) return;
			draft[control.dataset.layoutOption] = control.type === 'checkbox' ? control.checked : control.value;
			renderBuilder();
		});

		layoutOptionSettings.addEventListener('change', event => {
			const control = event.target.closest('[data-layout-option]');
			if (!control) return;
			draft[control.dataset.layoutOption] = control.type === 'checkbox' ? control.checked : control.value;
			renderBuilder();
		});

		document.getElementById('deviceGroup').addEventListener('click', event => {
			const button = event.target.closest('[data-device]');
			if (!button) return;
			draft.device = button.dataset.device;
			renderBuilder();
		});

		Object.values(fields).forEach(field => {
			field.addEventListener('input', renderBuilder);
			field.addEventListener('change', renderBuilder);
		});

		toggleIconFile.addEventListener('change', () => {
			const file = toggleIconFile.files && toggleIconFile.files[0];
			draft.toggleIconFileName = file ? file.name : '';
			draft.toggleIconUploadPreview = '';
			if (!file || !file.type.startsWith('image/')) {
				renderBuilder();
				return;
			}

			const reader = new FileReader();
			reader.addEventListener('load', () => {
				draft.toggleIconUploadPreview = String(reader.result || '');
				renderBuilder();
			});
			reader.readAsDataURL(file);
		});

		document.getElementById('addMockItem').addEventListener('click', () => {
			draft.items.push({
				title: `Menu Item ${draft.items.length + 1}`,
				desc: 'Sample dropdown link',
				icon: 'fas fa-link'
			});
			renderBuilder();
		});

		document.getElementById('resetBuilder').addEventListener('click', () => {
			draft = cloneConfig({
				...defaultConfig(),
				type: 'none',
				items: activeMenu.config.items
			});
			syncControlsFromDraft();
			renderBuilder();
		});

		document.getElementById('saveBuilder').addEventListener('click', () => {
			syncDraftFromControls();
			activeMenu.config = cloneConfig(draft);
			activeMenu.status = draft.type;
			renderParentMenuList();
			closeBuilder();
		});

		document.getElementById('toggleFullscreen').addEventListener('click', () => {
			layer.classList.toggle('is-fullscreen');
		});

		document.getElementById('closeBuilderTop').addEventListener('click', closeBuilder);
		document.getElementById('closeBuilderBottom').addEventListener('click', closeBuilder);

		layer.addEventListener('click', event => {
			if (event.target === layer) closeBuilder();
		});

		document.addEventListener('keydown', event => {
			if (event.key === 'Escape' && layer.classList.contains('is-open')) closeBuilder();
		});

		window.addEventListener('resize', () => requestAnimationFrame(positionDropdownArrow));

		renderParentMenuList();
		openBuilder(menus[1]);
	</script>
</body>
</html>
