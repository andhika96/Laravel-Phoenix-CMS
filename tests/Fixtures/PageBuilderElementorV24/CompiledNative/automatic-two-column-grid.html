<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <style>
        .hero { display: grid; grid-template-columns: 42% 58%; gap: 32px; padding: 80px 64px; border: 1px solid #d5b56b; }
        .hero-copy { min-width: 0; }
        .hero-media { min-height: 320px; }
    </style>
</head>
<body>
    <main>
        <section id="hero" class="hero">
            <div class="hero-copy"><h1>Two column hero</h1><p>Copy content.</p></div>
            <div class="hero-media"><img src="hero.jpg" alt="Hero"></div>
        </section>
    </main>
</body>
</html>
