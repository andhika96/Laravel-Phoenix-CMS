<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <style>
        .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; padding: 48px; }
        .card { min-height: 180px; border: 1px solid #ccd3df; padding: 24px; }
    </style>
</head>
<body>
    <main>
        <section id="cards" class="cards">
            <article class="card"><h2>One</h2><p>First card.</p></article>
            <article class="card"><h2>Two</h2><p>Second card.</p></article>
            <article class="card"><h2>Three</h2><p>Third card.</p></article>
        </section>
    </main>
</body>
</html>
