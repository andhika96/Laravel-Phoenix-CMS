<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Arunika Lucent green preview generator</title>
	<style>
		html,
		body,
		canvas
		{
			width: 1254px;
			height: 884px;
			margin: 0;
			padding: 0;
			display: block;
		}
	</style>
</head>
<body>
	<canvas id="preview" width="1254" height="884" aria-label="Arunika Lucent preview"></canvas>
	<script>
		const source = new Image();
		source.src = '../../../../public/assets/images/themes/previews/arunika-lucent-theme-preview.png';
		source.onload = () =>
		{
			const canvas = document.getElementById('preview');
			const context = canvas.getContext('2d', { willReadFrequently: true });
			context.drawImage(source, 0, 0, canvas.width, canvas.height);
			const pixels = context.getImageData(0, 0, canvas.width, canvas.height);

			const rgbToHsl = (red, green, blue) =>
			{
				red /= 255;
				green /= 255;
				blue /= 255;
				const maximum = Math.max(red, green, blue);
				const minimum = Math.min(red, green, blue);
				const lightness = (maximum + minimum) / 2;
				const difference = maximum - minimum;

				if (difference === 0)
				{
					return [0, 0, lightness];
				}

				const saturation = difference / (1 - Math.abs(2 * lightness - 1));
				let hue;

				if (maximum === red)
				{
					hue = ((green - blue) / difference) % 6;
				}
				else if (maximum === green)
				{
					hue = (blue - red) / difference + 2;
				}
				else
				{
					hue = (red - green) / difference + 4;
				}

				return [(hue / 6 + 1) % 1, saturation, lightness];
			};

			for (let index = 0; index < pixels.data.length; index += 4)
			{
				const pixel = index / 4;
				const x = pixel % canvas.width;
				const y = Math.floor(pixel / canvas.width);
				const red = pixels.data[index];
				const green = pixels.data[index + 1];
				const blue = pixels.data[index + 2];
				const [hue, saturation, lightness] = rgbToHsl(red, green, blue);
				const isBrandPaletteSwatch = x >= 565 && x <= 815 && y >= 200 && y <= 244;
				const isBlueAccent = !isBrandPaletteSwatch && saturation > 0.22 && hue > 0.54 && hue < 0.72 && blue > green + 18 && blue > red + 38;

				if (isBlueAccent)
				{
					const alpha = Math.min(1, Math.max(0, (blue - green) / 142));
					pixels.data[index] = Math.round(255 + (31 - 255) * alpha);
					pixels.data[index + 1] = Math.round(255 + (166 - 255) * alpha);
					pixels.data[index + 2] = Math.round(255 + (117 - 255) * alpha);
				}
			}

			context.putImageData(pixels, 0, 0);
			context.fillStyle = '#ffffff';
			context.fillRect(665, 253, 83, 31);
			context.fillStyle = '#202020';
			context.font = '16px Arial, sans-serif';
			context.fillText('#1FA675', 672, 275);
			document.documentElement.dataset.ready = 'true';
		};
	</script>
</body>
</html>
