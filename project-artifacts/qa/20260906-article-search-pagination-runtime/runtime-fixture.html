<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="../../../public/assets/plugins/fontawesome/5.15.3/css/all.min.css">
    <link rel="stylesheet" href="../../../public/assets/css/article/article-frontend-2026.css">
    <style>*,*::before,*::after{box-sizing:border-box}body{margin:0;background:#f5f7fa}.fixture{width:min(1180px,calc(100% - 2rem));margin:auto;padding:32px 0}.fixture h1{margin:0 0 18px;font:700 1.3rem/1.2 system-ui,sans-serif}.fixture-grid{display:grid;gap:18px}.fixture-card{padding:20px;border:1px solid #e3e7ee;background:#fff}.fixture-card h2{margin:0 0 12px;font:700 .9rem/1.2 system-ui,sans-serif}.fixture-card .article-template-header__copy{display:none}.fixture-card .article-template-toolbar{margin:0}.fixture-card .article-template-toolbar__zone{display:block}.fixture-card .article-template-toolbar__control--search{width:100%;max-width:none}.fixture-card .article-pagination{margin-top:16px}.fixture-card .article-pagination__context{display:none}.fixture-card .article-pagination__layout{justify-content:center}@media(max-width:575.98px){.fixture{width:calc(100% - 1rem);padding:16px 0}.fixture-card{padding:12px}.fixture-card .article-pagination .ph-pagination{gap:.2rem}.fixture-card .article-pagination .ph-pagination .page-link{min-width:2rem;height:2rem;padding-inline:.35rem}}</style>
</head>
<body>
<main class="article-page article-page--reading-list fixture">
    <h1>Production-shaped Search and Pagination</h1>
    <div class="fixture-grid">
        <section class="fixture-card">
            <h2>Attached Classic · custom gap, radius, icon, button states</h2>
            <header class="article-template-header article-template-header--minimal-reading-list">
                <form class="article-template-toolbar" data-article-filter><div class="article-template-toolbar__zone article-template-toolbar__zone--left"><div class="article-template-toolbar__control article-template-toolbar__control--search article-search-model--attached" style="--article-search-radius:12px;--article-search-gap:8px;--article-search-button-background:#16a579;--article-search-button-hover-background:#087956;--article-search-button-active-background:#065f46;--article-search-button-text:#fff;--article-search-button-hover-text:#fff;--article-search-button-active-text:#fff"><input type="search" value="Design systems" aria-label="Search articles"><button type="submit"><i class="fas fa-search" aria-hidden="true"></i><span>Search</span></button></div></div></form>
            </header>
        </section>
        <section class="fixture-card">
            <h2>Soft Field · custom gap, colors, and Font Awesome sliders icon</h2>
            <header class="article-template-header article-template-header--minimal-reading-list">
                <form class="article-template-toolbar" data-article-filter><div class="article-template-toolbar__zone article-template-toolbar__zone--left"><div class="article-template-toolbar__control article-template-toolbar__control--search article-search-model--soft" style="--article-search-radius:16px;--article-search-gap:12px;--article-search-input-background:#f1f5f8;--article-search-input-text:#172033;--article-search-button-background:#e5f6ef;--article-search-button-text:#087956;--article-search-button-hover-background:#16a579;--article-search-button-hover-text:#fff"><input type="search" value="Design systems" aria-label="Search articles"><button type="submit"><i class="fas fa-sliders-h" aria-hidden="true"></i><span>Search</span></button></div></div></form>
            </header>
        </section>
        <section class="fixture-card">
            <h2>Minimal Underline · active pagination override</h2>
            <header class="article-template-header article-template-header--minimal-reading-list">
                <form class="article-template-toolbar" data-article-filter><div class="article-template-toolbar__zone article-template-toolbar__zone--left"><div class="article-template-toolbar__control article-template-toolbar__control--search article-search-model--underline" style="--article-search-radius:20px;--article-search-gap:10px;--article-search-input-border:#16a579;--article-search-button-background:#e5f6ef;--article-search-button-text:#087956"><input type="search" value="Design systems" aria-label="Search articles"><button type="submit"><i class="fas fa-arrow-right" aria-hidden="true"></i><span>Search</span></button></div></div></form>
            </header>
            <nav class="article-pagination article-pagination--ssr article-pagination--model-soft article-pagination--without-total article-pagination--without-frame article-pagination--position-center" style="--article-pagination-item-radius:12px;--article-pagination-item-gap:10px;--article-pagination-item-active-background:#16a579;--article-pagination-item-active-text:#fff;--article-pagination-item-hover-background:#e5f6ef;--article-pagination-item-hover-text:#087956" aria-label="Article pagination"><div class="article-pagination__layout"><div class="article-pagination__pager"><ul class="pagination ph-pagination mb-0"><li class="page-item"><a class="page-link" href="#"><i class="fas fa-angle-left" aria-hidden="true"></i></a></li><li class="page-item active"><span class="page-link">1</span></li><li class="page-item"><a class="page-link" href="#">2</a></li><li class="page-item"><a class="page-link" href="#">3</a></li><li class="page-item article-pagination__ellipsis"><span class="page-link">…</span></li><li class="page-item"><a class="page-link" href="#">60</a></li><li class="page-item"><a class="page-link" href="#"><i class="fas fa-arrow-right" aria-hidden="true"></i></a></li></ul></div></div></nav>
        </section>
    </div>
</main>
</body>
</html>
