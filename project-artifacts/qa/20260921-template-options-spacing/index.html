<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Template Options — isolated CSS QA</title><link rel="stylesheet" href="http://laravel-13-phoenix.aruna/assets/plugins/bootstrap/5.3.6/css/bootstrap.min.css"><link rel="stylesheet" href="http://laravel-13-phoenix.aruna/assets/css/article/article-template-manager-2026.css?v=20260921"><style>body{background:#f2f4f7;padding:24px}main{max-width:480px;margin:auto;background:white}h1{font-size:18px;padding:20px 16px 0}.article-template-options-modal{position:static;display:block}.article-template-options-panel{max-height:none}section+section{margin-top:32px!important}footer{padding:16px;font-size:12px;color:#667085}</style></head><body><main class="article-template-manager" style="--ph-theme-primary:#1ca580"><h1>Template Options — CSS QA fixture</h1><div class="article-template-options-modal"><div class="article-template-options-panel">
<section class="article-template-options-section"><div class="article-template-options-section__heading"><h5>Grid columns</h5></div><div class="article-template-device-tabs" role="group" aria-label="Device"><button class="active">Desktop</button><button>Tablet</button><button>Mobile</button></div><div class="article-template-columns" role="group" aria-label="Grid columns"><button>1 Column</button><button>2 Columns</button><button class="active">3 Columns</button><button>4 Columns</button></div></section>
<section class="article-template-options-section"><div class="article-template-editorial-journal-fields"><fieldset class="article-template-editorial-journal-group"><legend>Card</legend><div class="article-template-radius-control"><div class="article-template-radius-label-row"><label class="article-template-radius-label">Border radius</label><select class="form-select article-template-radius-unit" aria-label="Radius unit"><option>rem</option><option>px</option></select></div><div class="article-template-radius-fields">
<label class="article-template-radius-side"><input class="form-control" type="number" min="0" max="10" step="0.1" value="0.9"><span>Top Left</span></label><label class="article-template-radius-side"><input class="form-control" type="number" min="0" max="10" step="0.1" value="0.9"><span>Top Right</span></label><label class="article-template-radius-side"><input class="form-control" type="number" min="0" max="10" step="0.1" value="0.9"><span>Bottom Right</span></label><label class="article-template-radius-side"><input class="form-control" type="number" min="0" max="10" step="0.1" value="0.9"><span>Bottom Left</span></label><div class="article-template-radius-link-cell"><button class="btn article-template-radius-link active" aria-label="Link values">&#128279;</button></div></div></div><label>Card background<select class="form-select"><option>Background Color</option></select></label><label>Background Color<input class="form-control" value="#ffffff"></label><label>Card height<select class="form-select"><option>Auto</option></select></label></fieldset></div></section>
<section class="article-template-options-section"><div class="article-template-search-style-fields"><label>Search model<select class="form-select"><option>Attached Classic</option></select></label><label>Search button gap<span class="article-template-unit-control"><input class="form-control" type="number" min="0" max="10" step="0.05" value="0.75"><select class="form-select" aria-label="Gap unit"><option>rem</option></select></span></label><label>Input background<input class="form-control" placeholder="Theme default"></label><label>Input text<input class="form-control" placeholder="Theme default"></label></div></section></div></div><footer>Isolated control fixture using the served production stylesheet. No application persistence or preview.</footer></main></body></html>
