									<div id="ph-form-recovery-password-submit">
	<teleport to="body">
	<div class="ph-notice" v-cloak>
		<div aria-live="polite" aria-atomic="true" class="position-relative">
			<div class="toast-container position-fixed top-0 end-0 p-3">
				<div ref="noticeToast" :class="'toast ph-notice-toast ph-callout-no-border '+responseStatusToast" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="3000">
					<div :class="'toast-header '+responseStatusToast+' pe-3 pt-3 pb-1 border-0'">
						<strong class="toast-header-title toast-header-icon me-auto">Notice</strong>
						<small>just now</small>
						<button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close" style="margin-right: calc(-.1 * var(--bs-toast-padding-x));"></button>
					</div>
					<div class="toast-body p-3 text-start">
						<div v-if="isArrayMessageAfterSubmit == 1">
							<ul class="ps-3 m-0"><li v-for="(item, index) in responseMessageAfterSubmit" :key="index">{{ Array.isArray(item) ? item.join(' ') : item }}</li></ul>
						</div>
						<div v-else>{{ responseMessageAfterSubmit }}</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</teleport>
	<form action="http://laravel-13-phoenix.aruna/auth/recoveryaccount" method="post" @submit="recoveryPassword" ref="formHTML" custom-button-class="ph-auth-modern-submit">
		<input type="hidden" name="_token" value="" autocomplete="off">		<div class="ph-auth-form-fields">
													<div class="ph-auth-field">
					<label for="ph-auth-password">New password</label>
					<div class="ph-auth-password-wrap">
												<input id="ph-auth-password" :type="passwordVisibility.password ? 'text' : 'password'" class="form-control" name="password" autocomplete="new-password" placeholder="Enter your password" required>
						<button type="button" class="ph-auth-password-toggle" @click="passwordVisibility.password = !passwordVisibility.password" :aria-pressed="passwordVisibility.password" :aria-label="passwordVisibility.password ? 'Hide password' : 'Show password'">
							<span v-show="!passwordVisibility.password"><i class="far fa-eye" aria-hidden="true"></i></span><span v-show="passwordVisibility.password"><i class="far fa-eye-slash" aria-hidden="true"></i></span>
						</button>
					</div>
				</div>
										<div class="ph-auth-field">
					<label for="ph-auth-password-confirmation">Confirm new password</label>
					<div class="ph-auth-password-wrap">
												<input id="ph-auth-password-confirmation" :type="passwordVisibility.confirmation ? 'text' : 'password'" class="form-control" name="password_confirmation" autocomplete="new-password" placeholder="Re-enter your password" required>
						<button type="button" class="ph-auth-password-toggle" @click="passwordVisibility.confirmation = !passwordVisibility.confirmation" :aria-pressed="passwordVisibility.confirmation" :aria-label="passwordVisibility.confirmation ? 'Hide confirmation password' : 'Show confirmation password'">
							<span v-show="!passwordVisibility.confirmation"><i class="far fa-eye" aria-hidden="true"></i></span><span v-show="passwordVisibility.confirmation"><i class="far fa-eye-slash" aria-hidden="true"></i></span>
						</button>
					</div>
				</div>
				<input type="hidden" name="code" value="non-submittable-qa-fixture">
												<input type="submit" class="btn btn-larapx ph-auth-modern-submit btn-submit-recovery-password w-100 p-2" value="Update password">
		</div>
	</form>
</div>
