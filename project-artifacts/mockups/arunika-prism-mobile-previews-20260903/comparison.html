<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arunika Prism Mobile Preview Comparison</title>
  <style>
    :root { color-scheme: light; font-family: Nunito, "Segoe UI", sans-serif; background: #f7f5f7; color: #20233a; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; }
    header { max-width: 1240px; margin: 0 auto 22px; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -0.03em; }
    p { margin: 7px 0 0; color: #6d7182; font-size: 14px; }
    .board { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
    figure { margin: 0; padding: 10px; border: 1px solid #e5e3e7; border-radius: 14px; background: #fff; box-shadow: 0 7px 22px rgba(48, 38, 60, .07); }
    figcaption { padding: 4px 5px 10px; font-size: 14px; font-weight: 800; }
    img { display: block; width: 100%; height: auto; border-radius: 8px; }
    @media (max-width: 900px) { body { padding: 18px; } .board { grid-template-columns: 1fr; max-width: 460px; } }
  </style>
</head>
<body>
  <header>
    <h1>Arunika Prism — Mobile Preview Set</h1>
    <p>Selected directions: dashboard, profile sheet, and desktop-consistent drawer with Awesome Admin footer.</p>
  </header>
  <main class="board">
    <figure>
      <figcaption>Preview 2</figcaption>
      <img src="prism-airy-dashboard.png" alt="Arunika Prism mobile dashboard preview">
    </figure>
    <figure>
      <figcaption>Preview 3</figcaption>
      <img src="prism-profile-sheet.png" alt="Arunika Prism mobile profile sheet preview">
    </figure>
    <figure>
      <figcaption>Latest sidebar preview</figcaption>
      <img src="prism-desktop-consistent-drawer-admin-footer.png" alt="Arunika Prism mobile drawer with Awesome Admin footer preview">
    </figure>
  </main>
</body>
</html>
