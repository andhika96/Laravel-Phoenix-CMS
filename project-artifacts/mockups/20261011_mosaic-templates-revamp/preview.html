<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview Mosaic Magazine dan Classic</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#edf1f4;color:#243144;font:14px/1.5 system-ui,sans-serif}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px;background:#fff;border-bottom:1px solid #d9e1e8;flex-wrap:wrap}.title{font-weight:650;font-size:15px}.hint{display:block;color:#667085;font-size:12px;font-weight:400;margin-top:2px}.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}button,a,select{font:inherit;min-height:40px;padding:8px 12px;border:1px solid #d3dce4;border-radius:7px;background:#fff;color:#425269;text-decoration:none;cursor:pointer}button[aria-pressed="true"]{background:#eaf5ef;border-color:#137e5e;color:#137e5e}:focus-visible{outline:3px solid #75bfa7;outline-offset:3px}.stage{padding:24px;overflow:hidden}.frame{margin:auto;border:1px solid #d9e1e8;background:#fff;overflow:hidden}iframe{display:block;transform-origin:top left;border:0;background:#fff}output{display:block;text-align:center;color:#667085;font-size:12px;margin:0 0 20px}@media(max-width:600px){.toolbar{padding:12px 16px}.stage{padding:16px}}
</style></head><body><header class="toolbar"><div class="title">Mosaic templates<span class="hint">Preview revamp · typography CMS · desktop, tablet, mobile</span></div><nav class="controls" aria-label="Kontrol preview"><select id="template" aria-label="Template"><option value="magazine">Mosaic Magazine</option><option value="classic">Mosaic Classic</option></select><button data-width="1440" aria-pressed="true">Desktop</button><button data-width="768" aria-pressed="false">Tablet</button><button data-width="390" aria-pressed="false">Mobile</button><a id="full" href="magazine.html" target="_blank" rel="noopener">Buka ukuran penuh ↗</a></nav></header><div class="stage" id="stage"><div class="frame" id="frame"><iframe src="magazine.html" id="prototype" title="Preview template Mosaic"></iframe></div></div><output id="dimensions"></output><script>
let width=1440;const iframe=document.getElementById('prototype'),frame=document.getElementById('frame'),stage=document.getElementById('stage');
function fit(){const scale=Math.min(1,(stage.clientWidth-parseFloat(getComputedStyle(stage).paddingLeft)*2)/width);iframe.style.width=width+'px';const height=iframe.contentDocument?.body.getBoundingClientRect().height||1800;iframe.style.height=height+'px';iframe.style.transform=`scale(${scale})`;frame.style.width=width*scale+'px';frame.style.height=height*scale+'px';document.getElementById('dimensions').textContent=`${width} px · ${Math.round(scale*100)}% ukuran asli`;}
document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{width=Number(button.dataset.width);document.querySelectorAll('[data-width]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));iframe.style.height='1px';requestAnimationFrame(fit);}));
document.getElementById('template').addEventListener('change',event=>{iframe.src=event.target.value+'.html';document.getElementById('full').href=iframe.src;iframe.style.height='1px';});
iframe.addEventListener('load',()=>{iframe.style.width=width+'px';new ResizeObserver(fit).observe(iframe.contentDocument.body);fit();});window.addEventListener('resize',fit);
</script></body></html>
