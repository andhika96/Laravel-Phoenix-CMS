<!doctype html>
<html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arunika — Mobile Theme Previews</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f0;color:#172b24;font:16px Arial,sans-serif}.board{width:944px;margin:0 auto;padding:32px 40px;background:#f7faf8}header{border-bottom:1px solid #d7e1db;padding-bottom:20px;margin-bottom:22px}.eyebrow{font-size:12px;letter-spacing:2px;color:#537465;text-transform:uppercase}h1{margin:10px 0;font-size:32px}p{line-height:1.5;margin:8px 0}.states{display:flex;gap:32px}.state{width:416px}.state h2{font-size:17px;margin:0 0 12px}.state img{display:block;width:400px;height:844px;border:1px solid #d7e1db;border-radius:14px;box-shadow:0 6px 18px #183b2110}footer{margin-top:22px;font-size:14px;color:#355347}a{color:#147453}nav{padding:20px;text-align:center}nav a{margin:0 8px}small{color:#64786c}
.board{width:640px;padding:20px}header{padding-bottom:10px;margin-bottom:14px}.eyebrow{font-size:10px}h1{font-size:25px;margin:6px 0}header p{font-size:13px}small{font-size:11px}.states{gap:24px}.state{width:288px}.state h2{font-size:13px;margin-bottom:8px}.state img{width:260px;height:549px}footer{margin-top:14px;font-size:12px}footer p{margin:6px 0}nav{padding:12px;font-size:13px}
</style>
<nav id="nav"></nav><main class="board" id="board"></main>
<script>
const themes=[
 {slug:'arunika-mosaic',name:'Arunika Mosaic',mode:'Dark',right:'Di kanan tombol buka: palet warna dan mode tampilan; sisi kanan header: notifikasi, menu tambahan, dan avatar.',menu:'Visit Site, Dashboard, Manage Articles, Manage Cover Image, Manage Event; Awesome Admin di bawah.'},
 {slug:'arunika-aurora',name:'Arunika Aurora',mode:'Light',right:'Toggle berada di kiri. Sisi kanan header: palet warna, mode tampilan, dan Awesome Admin.',menu:'Visit Site, Dashboard, kategori All Menus, Manage Articles, Manage Cover Image, Manage Event; profil dan Logout di bawah.'},
 {slug:'arunika-prism',name:'Arunika Prism',mode:'Light',right:'Toggle berada di kiri. Sisi kanan header menampilkan Awesome Admin; profil tersedia pada footer sidebar.',menu:'Visit Site, Dashboard, All Menus, Manage Articles, Manage Cover Image, Manage Event; profil di bawah.'},
 {slug:'arunika-equinox',name:'Arunika Equinox',mode:'Light',right:'Toggle berada di kiri. Sisi kanan header: Awesome Admin dan tombol avatar/profil.',menu:'Visit Site, Dashboard, Manage Articles, Manage Cover Image, Manage Event; sidebar bermotif landscape.'},
 {slug:'arunika-lucent',name:'Arunika Lucent',mode:'Light',right:'Toggle pembuka berada di kanan atas konten—tidak ada kontrol lain di sebelah kanannya. Saat sidebar terbuka, tombol penutup berada di baris akun.',menu:'Dashboard, View site, Manage Articles, Manage Cover Image, Manage Event; Awesome Admin dan Settings di bawah.'}
];
const selected=themes.find(t=>t.slug===new URLSearchParams(location.search).get('theme'))||themes[0];
document.querySelector('#nav').innerHTML=themes.map(t=>`<a href="?theme=${t.slug}">${t.name.replace('Arunika ','')}</a>`).join('');
document.querySelector('#board').innerHTML=`<header><div class="eyebrow">Mobile runtime preview · 03 September 2026</div><h1>${selected.name}</h1><p>Viewport 400 × 844 px · ${selected.mode} · akun Administrator</p><small>Dokumentasi tampilan aktual, bukan redesign atau klaim bebas bug.</small></header><div class="states"><section class="state"><h2>01 / Sidebar tertutup — SHOW</h2><img src="${selected.slug}-sidebar-closed.png" alt="${selected.name} sidebar tertutup"></section><section class="state"><h2>02 / Sidebar terbuka — HIDE</h2><img src="${selected.slug}-sidebar-open.png" alt="${selected.name} sidebar terbuka"></section></div><footer><p><b>Header & toggle:</b> ${selected.right}</p><p><b>Menu:</b> ${selected.menu}</p><small>Catatan: overlap chart dashboard yang sudah ditemukan belum termasuk perbaikan ini.</small></footer>`;
</script></html>
