<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview Balanced Card Grid</title><link rel="icon" href="data:,"><style>
*{box-sizing:border-box}body{margin:0;background:#edf1f4;color:#243144;font:14px/1.5 system-ui,sans-serif}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px;background:#fff;border-bottom:1px solid #d9e1e8;flex-wrap:wrap}.title{font-weight:650;font-size:15px}.hint{display:block;color:#667085;font-size:12px;font-weight:400;margin-top:2px}.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}button,a{font:inherit;min-height:44px;padding:8px 12px;border:1px solid #d3dce4;border-radius:8px;background:#fff;color:#344054;text-decoration:none;cursor:pointer}button[aria-pressed=true]{border-color:#137e5e;background:#edf8f3;color:#137e5e}.stage{padding:24px 16px;overflow:hidden}.frame{position:relative;margin:auto;background:#fff;box-shadow:0 8px 28px #26374712}iframe{position:absolute;left:0;top:0;border:0;transform-origin:top left;background:#fff}.size{display:block;text-align:center;color:#667085;margin:12px}@media(max-width:600px){.toolbar{padding:14px 16px}.stage{padding-top:16px}}
</style></head><body><div class="toolbar"><div class="title">Balanced Card Grid · Revamp<span class="hint">Preview desktop, tablet, dan mobile</span></div><div class="controls"><button data-width="1440" aria-pressed="true">Desktop</button><button data-width="768" aria-pressed="false">Tablet</button><button data-width="390" aria-pressed="false">Mobile</button><a href="index.html" target="_blank" rel="noopener">Buka ukuran penuh</a></div></div><main class="stage"><div class="frame"><iframe title="Balanced Card Grid preview" src="index.html"></iframe></div><span class="size"></span></main><script>
const iframe=document.querySelector('iframe'),frame=document.querySelector('.frame');let width=1440;
function fit(){if(!iframe.contentDocument)return;iframe.style.width=width+'px';const scale=Math.min(1,(document.querySelector('.stage').clientWidth-32)/width),height=iframe.contentDocument.documentElement.scrollHeight;iframe.style.height=height+'px';iframe.style.transform=`scale(${scale})`;frame.style.width=width*scale+'px';frame.style.height=height*scale+'px';document.querySelector('.size').textContent=`${width} px · ${Math.round(scale*100)}% ukuran asli`;}
document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{width=Number(button.dataset.width);document.querySelectorAll('[data-width]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));iframe.style.height='1px';requestAnimationFrame(fit);}));
iframe.addEventListener('load',()=>{new ResizeObserver(fit).observe(iframe.contentDocument.body);fit();});window.addEventListener('resize',fit);
</script></body></html>
