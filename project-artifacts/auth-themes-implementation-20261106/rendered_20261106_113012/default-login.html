			<meta charset="utf-8">
			<meta name="viewport" content="width=device-width, initial-scale=1">

			<style>
				body.ph-auth-page
				{
					--page-header-background: #1fa6759f;
					--auth-primary: #1FA675;
					--auth-primary-hover: #1C9569;
					--auth-primary-active: #19855E;
					--auth-primary-disabled: #BCE4D6;
					--auth-primary-text: #000000;
					--auth-primary-hover-text: #000000;
					--auth-primary-active-text: #FFFFFF;
					--auth-primary-rgb: 31, 166, 117;
				}
			</style>

			
			<title>LaraPhoenix CMS | Login</title>
		</head>
		
		<body class="ph-auth-page" data-auth-page="login" data-auth-layout="default" data-auth-has-image="true">
			
	<div class="page-header" id="ph-app-auth">
		<div class="page-header-image" style="background-image: url('http://laravel-13-phoenix.aruna/storage/images/page_themes/082025/date_05/e1ad653cbc3c3da22f8270e6054e597a.jpg');"></div>
		
		<div class="container">

							<div class="d-flex justify-content-center align-items-center vh-100">
			
				<div class="ph-form rounded border-0 p-4 p-lg-5">
					<div id="ph-form-login-submit">
						<form action="http://laravel-13-phoenix.aruna/auth/login" method="post" @submit="login" ref="formHTML" custom-button-class="rounded-pill">
							<div class="row g-3 gy-2">
								<div class="col-12 form-group text-center">
									<h4 class="fw-bold">Log In</h4>
									<p>Enter your email address and password to the dashboard.</p>

									<div class="ph-notice" v-cloak>
										<div aria-live="polite" aria-atomic="true" class="position-relative">
											<div class="toast-container position-fixed top-0 end-0 p-3">
												<div :class="'toast ph-notice-toast ph-callout-no-border '+responseStatusToast" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="3000">
													<div :class="'toast-header '+responseStatusToast+' pe-3 pt-3 pb-1 border-0'">
														<strong class="toast-header-title toast-header-icon me-auto">Notice</strong>
														<small>just now</small>
														<button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close" style="margin-right: calc(-.1 * var(--bs-toast-padding-x));"></button>
													</div>
												
													<div class="toast-body p-3 text-start">
														<div v-if="isArrayMessageAfterSubmit == 1">
															<ul class="ps-3 m-0">
																<li v-for="(item, index) in responseMessageAfterSubmit">
																	{{ item[0] }}
																</li>
															</ul>
														</div>

														<div v-else>
															{{ responseMessageAfterSubmit }}
														</div>
													</div>
												</div>
											</div>
										</div>
									</div>
								</div>

								<div class="col-12 input-group form-group-no-border input-group-md">
									<span class="input-group-text rounded-pill"><i class="fas fa-at ms-1"></i></span>
									<input type="text" name="email" class="form-control form-control-default-view rounded-pill ms-0" placeholder="Enter your email">
								</div>

								<div class="col-12 input-group form-group-no-border input-group-md">
									<span class="input-group-text rounded-pill"><i class="fas fa-key ms-1"></i></span>
									<input type="password" name="password" class="form-control form-control-default-view rounded-pill ms-0" placeholder="Enter your password">
								</div>

								<div class="col-12 form-group">
									<div class="form-check mt-1">
										<input name="remember_me" class="form-check-input" type="checkbox" id="flexCheckDefault">

										<label class="form-check-label" for="flexCheckDefault">
											Remember me
										</label>
									</div>
								</div>

							
								<div class="col-12 form-group text-center">
									<input type="hidden" name="_token" value="" autocomplete="off">									<input type="submit" class="btn btn-larapx btn-submit-login rounded-pill w-100 p-2" value="Log In">
								</div>
							</div>
						</form>
					</div>

					<div class="row fs-sm my-4">

													<div class="col-6">
								<a class="text-white text-decoration-underline" href="http://laravel-13-phoenix.aruna/auth/signup">Create an account</a>
							</div>
						
						<div class="col-6  text-end ">
							<a class="text-white text-decoration-underline" href="http://laravel-13-phoenix.aruna/auth/forgotpassword">Forgot Password</a>
						</div>
					</div>

								
				</div>
			</div>
		</div>
	</div>

	</body>
