			<title>LaraPhoenix CMS | Reset Password</title>
		</head>
		
		<body class="ph-auth-page" data-auth-page="resetPassword" data-auth-layout="default" data-auth-has-image="true">
			
	<div class="page-header" id="ph-app-auth">
		<div class="page-header-image" style="background-image: url('http://laravel-13-phoenix.aruna/storage/images/page_themes/082025/date_05/6dccdc76d026c511a093aaf710bc162b.png');"></div>
		
		<div class="container">
			<div class="d-flex justify-content-center align-items-center vh-100">
				<div class="ph-form rounded border-0 p-4 p-lg-5">
					<div id="ph-form-recovery-password-submit">
						<form action="http://laravel-13-phoenix.aruna/auth/recoveryaccount" method="post" @submit="recoveryPassword" ref="formHTML" custom-button-class="rounded-pill">
							<div class="row g-3 gy-4">
								<div class="col-12 form-group text-center">
									<h4 class="fw-bold">Reset Password</h4>
									<p class="text-white">Enter your new password to recover your account.</p>

									<div class="ph-notice" v-cloak>
										<div aria-live="polite" aria-atomic="true" class="position-relative">
											<div class="toast-container position-fixed top-0 end-0 p-3">
												<div :class="'toast ph-notice-toast ph-callout-no-border '+responseStatusToast" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="3000">
													<div :class="'toast-header '+responseStatusToast+' pe-3 pt-3 pb-1 border-0'">
														<strong class="toast-header-title toast-header-icon me-auto">Notice</strong>
														<small>just now</small>
														<button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close" style="margin-right: calc(-.1 * var(--bs-toast-padding-x));"></button>
													</div>
												
													<div class="toast-body p-3 text-start">
														<div v-if="isArrayMessageAfterSubmit == 1">
															<ul class="ps-3 m-0">
																<li v-for="(item, index) in responseMessageAfterSubmit">
																	{{ item[0] }}
																</li>
															</ul>
														</div>

														<div v-else>
															{{ responseMessageAfterSubmit }}
														</div>
													</div>
												</div>
											</div>
										</div>
									</div>
								</div>

								<div class="col-12 input-group form-group-no-border input-group-md">
									<span class="input-group-text rounded-pill"><i class="fas fa-key ms-1"></i></span>
									<input type="password" name="password" class="form-control form-control-default-view rounded-pill ms-0" placeholder="Enter your new password">
								</div>

								<div class="col-12 input-group form-group-no-border input-group-md">
									<span class="input-group-text rounded-pill"><i class="fas fa-key ms-1"></i></span>
									<input type="password" name="password_confirmation" class="form-control form-control-default-view rounded-pill ms-0" placeholder="Enter re-type password">
								</div>	

								<div class="col-12 form-group text-center">
									<input type="hidden" name="code" value="non-submittable-qa-fixture">
									<input type="submit" class="btn btn-larapx btn-submit-recovery-password rounded-pill w-100 p-2" value="Submit">
								</div>
							</div>
						</form>
					</div>			
				</div>
			</div>
		</div>
	</div>
