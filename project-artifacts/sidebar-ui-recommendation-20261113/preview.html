<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Alternatif Sidebar Lucent</title>
<style>
  * {box-sizing: border-box}
  body {margin:0;background:#f1f4f2;color:#202924;font-family:'Segoe UI',sans-serif}
  main {max-width:1148px;margin:auto;padding:30px 40px 24px}
  header {margin-bottom:24px}
  h1 {margin:0 0 8px;font-size:26px;letter-spacing:-.5px;line-height:1.25;font-weight:650}
  header p {margin:0;color:#58665d;font-size:14px;line-height:1.5}
  .states {display:grid;grid-template-columns:288px 288px 360px;gap:24px}
  figure {margin:0;border:1px solid #dce3de;border-radius:12px;background:white;overflow:hidden}
  figure.recommended {border-color:#92bda5;box-shadow:0 0 0 2px #e1eee6}
  figcaption {min-height:98px;padding:17px 16px;border-bottom:1px solid #e6eae7}
  h2 {font-size:15px;line-height:1.4;margin:0 0 6px;font-weight:650}
  figcaption p {font-size:12px;color:#56625b;line-height:1.5;margin:0}
  img {display:block;width:100%;height:auto}
  .recommend {color:#246549}
  footer {margin-top:18px;font-size:12px;color:#58665d;line-height:1.6}
  @media(max-width:1000px) {main{max-width:440px;padding:24px}.states{grid-template-columns:1fr;gap:24px}img{max-width:360px;margin:auto}}
</style>
</head>
<body><main>
  <header><h1>Alternatif sidebar Lucent</h1><p>Identitas tetap sama, dengan kategori dan posisi halaman aktif yang lebih jelas.</p></header>
  <div class="states">
    <figure><figcaption><h2>01 · Preview sebelumnya</h2><p>Kategori dan submenu yang sudah Anda sukai.</p></figcaption><img src="01-previous.png" width="288" height="800" alt="Preview sebelumnya dengan kategori All Menus dan menu Testing terbuka."></figure>
    <figure class="recommended"><figcaption><h2 class="recommend">02 · Rekomendasi saya</h2><p>Label kategori lebih tenang; halaman aktif memiliki penanda sendiri.</p></figcaption><img src="02-recommended.png" width="288" height="800" alt="Usulan Lucent dengan garis kategori, pandu submenu, dan contoh Submenu Test 1 yang dipilih."></figure>
    <figure><figcaption><h2>03 · Saat sidebar dilipat</h2><p>Induk menu tetap ditandai; posisi hover dan panah mengikuti koreksi Anda.</p></figcaption><img src="03-recommended-collapsed.png" width="360" height="800" alt="Sidebar dilipat dengan penanda induk aktif dan panel submenu yang sejajar batas sidebar."></figure>
  </div>
  <footer>Usulan visual, belum diterapkan. <strong>Submenu Test 1</strong> digunakan sebagai contoh halaman aktif. Nama kategori dan daftar menu mengikuti data lokal.</footer>
</main></body>
</html>
